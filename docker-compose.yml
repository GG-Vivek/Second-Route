version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secondroute-postgres
    environment:
      POSTGRES_DB: secondroute
      POSTGRES_USER: secondroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # The application connects as this role, not as the bootstrap
      # superuser: PostgreSQL bypasses row-level security for superusers,
      # so connecting as one would make the tenant-isolation policies
      # decorative.
      POSTGRES_APP_USER: secondroute_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/alembic:/alembic:ro
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondroute -d secondroute"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - secondroute-network

  redis:
    image: redis:7-alpine
    container_name: secondroute-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - secondroute-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: secondroute-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/secondroute
      KC_DB_USERNAME: secondroute
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - secondroute-network

  caddy:
    image: caddy:2-alpine
    container_name: secondroute-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    depends_on:
      - backend
      - frontend
    networks:
      - secondroute-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secondroute-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://secondroute_app:${POSTGRES_PASSWORD:-changeme}@postgres:5432/secondroute
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secondroute-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secondroute-frontend
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      # The dev server forwards the API inside the compose network. The
      # source is mounted into the container, so a developer's
      # frontend/.env is visible here as well: an environment variable
      # takes priority over the file, so this is what the container uses
      # and the host's address never leaks into it.
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - secondroute-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  secondroute-network:
    driver: bridge