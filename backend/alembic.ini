# Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/configuration.html

[alembic]
# Template used to generate migration file names
# %%(rev)s = revision number, %%(slug)s = descriptive string
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Path to migration scripts
script_location = alembic

# Prepend script location with this directory
# prepend_sys_path = .

# Timezone to use for timestamps
timezone = UTC

# Maximum number of characters in a migration message
# max_message_length = 512

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S